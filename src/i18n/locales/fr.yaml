checkout:
  title: "Éco gestes"
  subtitle: "Gestion déchets, tri sélectif"
  wasteTitle: "Gestion des déchets"
  wasteSubtitle: "Lorem ipsum"
  wasteItems:
    - title: "Déchets ménagers"
      desc: "Restes alimentaires"
    - title: "Verres"
      desc: "Bouteilles, Bocaux conserve, Pots confitures"
    - title: "Déchets recyclables"
      desc: "Emballages et bouteilles plastiques, Cartons, papiers, magazines, Boites de conserves, Canettes"
  infoTitle: "Information"
  infoBody: "Pensez au tri sélectif dans votre entreprise, cela permet aux déchets de faire l'objet d'un traitement spécifique et être ainsi valorisés."
  adoptTitle: "Éco Geste à adopter"
  adoptSubtitle: "Quels sont les bons gestes éco responsables à adopter au bureau ?"
  sections:
    - id: climatisation
      title: "Climatisation"
      items:
        - name: "Fermez les fenêtres"
          detail: "lorsque la climatisation fonctionne"
        - name: "Pensez à l'éteindre"
          detail: "avant de partir en week-end"
        - name: "Attention au émetteurs de froid"
          detail: "veiller à ne pas les obstruer"
        - name: "Penser à baisser les stores"
          detail: "afin de réduire la consommation"
        - name: "Profiter de l'air frais du matin"
          detail: "pour rafraîchir et ventiler vos locaux"
    - id: chauffage
      title: "Chauffage"
      items:
        - name: "Limiter la température à 19°C"
          detail: "1°C de moins permet d'économiser 7% d'énergie"
    - id: eclairage
      title: "Éclairage"
      items:
        - name: "Veillez à éteindre les lumières"
          detail: "lorsque vous sortez d'une pièce"
        - name: "Installer des minuteurs ou détecteur"
          detail: "dans les locaux de passage"
        - name: "Remplacer vos ampoules classiques"
          detail: "par des ampoules basse consommation de type LED"
    - id: eau
      title: "Eau"
      items:
        - name: "Couper l'eau"
          detail: "quand vous ne vous en servez pas"
        - name: "Signaler les fuites"
          detail: "au Welcome Manager"
        - name: "Utiliser la demi-chasse d'eau"
          detail: "cela permet d'économiser 3 litres d'eau à chaque passage"
        - name: "Remplir sa gourde ou son mug"
          detail: "éviter les bouteilles en plastique"
    - id: papier
      title: "Papier"
      items:
        - name: "Imprimer avec parcimonie"
          detail: "seulement ce qui est essentiel"
        - name: "Imprimer en noir et blanc"
          detail: "et de préférence en recto verso"
        - name: "Recycler les papiers imprimés"
          detail: "en brouillon"
        - name: "Penser à installer une badgeuse"
          detail: "Cela réduit de moitié la consommation de papier et d'encre"
    - id: bureautique
      title: "Bureautique"
      items:
        - name: "Débrancher les prises inutilisés"
          detail: "et ne pas laisser d'appareil en veille"
        - name: "Ne pas laisser un chargeur branché"
          detail: "même non relié à un appareil, il consomme de l'énergie"
        - name: "Penser à éteindre votre ordinateur"
          detail: "pendant les périodes prolongées de non utilisation (notamment à midi)"
        - name: "Préférer un fond d'écran sombre et fixe"
          detail: "il consommera moins"
        - name: "Privilégier la messagerie instantané"
          detail: "pour envoyer des messages à vos collègues plutôt que les emails"

