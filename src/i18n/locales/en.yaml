checkout:
  title: "Green Habits"
  subtitle: "Waste management, sorting"
  wasteItems:
    - title: "Household waste"
      desc: "Food leftovers, other non-recyclable waste."
    - title: "Glass"
      desc: "Bottles, jars and glass pots only."
    - title: "Recyclable waste"
      desc: "Plastic packaging, cardboard, paper, cans."
  sections:
    - id: climatisation
      title: "Air conditioning"
      items:
        - name: "Close the windows"
          detail: "while the air conditioning is running"
        - name: "Remember to turn it off"
          detail: "before leaving for the weekend"
        - name: "Watch out for cold air vents"
          detail: "make sure not to obstruct them"
        - name: "Remember to lower the blinds"
          detail: "to reduce energy consumption"
        - name: "Make the most of the cool morning air"
          detail: "to refresh and ventilate your space"
    - id: chauffage
      title: "Heating"
      items:
        - name: "Limit the temperature to 19°C"
          detail: "1°C less saves 7% of energy"
    - id: eclairage
      title: "Lighting"
      items:
        - name: "Remember to turn off the lights"
          detail: "when you leave a room"
        - name: "Install timers or sensors"
          detail: "in passageways"
        - name: "Replace your standard bulbs"
          detail: "with low-consumption LED bulbs"
    - id: eau
      title: "Water"
      items:
        - name: "Turn off the water"
          detail: "when you're not using it"
        - name: "Report leaks"
          detail: "to the Welcome Manager"
        - name: "Use the half-flush"
          detail: "this saves 3 litres of water each time"
        - name: "Fill up your own bottle or mug"
          detail: "avoid plastic bottles"
    - id: papier
      title: "Paper"
      items:
        - name: "Print sparingly"
          detail: "only what's essential"
        - name: "Print in black and white"
          detail: "and preferably double-sided"
        - name: "Recycle printed paper"
          detail: "as scrap paper"
        - name: "Consider installing a badge reader"
          detail: "this halves paper and ink consumption"
    - id: bureautique
      title: "Office equipment"
      items:
        - name: "Unplug unused sockets"
          detail: "and don't leave devices on standby"
        - name: "Don't leave a charger plugged in"
          detail: "even without a device attached, it still uses energy"
        - name: "Remember to turn off your computer"
          detail: "during extended periods of inactivity (e.g. at lunchtime)"
        - name: "Prefer a dark, static wallpaper"
          detail: "it will consume less power"
        - name: "Favour instant messaging"
          detail: "to reach colleagues rather than email"

